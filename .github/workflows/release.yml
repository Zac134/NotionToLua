name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun_target: bun-linux-x64
            artifact_suffix: linux-x86_64
          - bun_target: bun-linux-arm64
            artifact_suffix: linux-aarch64
          - bun_target: bun-darwin-x64
            artifact_suffix: macos-x86_64
          - bun_target: bun-darwin-arm64
            artifact_suffix: macos-aarch64
          - bun_target: bun-windows-x64
            artifact_suffix: windows-x86_64
          - bun_target: bun-windows-arm64
            artifact_suffix: windows-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Package release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-release.sh "$VERSION" "${{ matrix.bun_target }}" dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: NotionToLua-${{ matrix.artifact_suffix }}
          path: dist/release/NotionToLua-*-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
